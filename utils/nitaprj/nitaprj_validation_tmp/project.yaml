description: JTAF-generated Ansible role deployment
name: nitaprj_validation_tmp
action:
  - name: Generate JTAF Ansible Roles
    jenkins_url: generate_jtaf_roles
    category: BUILD
    configuration:
      shell_command: >
        write_yaml_files.py;
        create_jtaf_role_k8s.py generate;
        kubectl apply -f generate.yaml;
        kubectl wait --for=jsonpath="{.status.ready}"=1 job/generate --timeout=600s;
        kubectl logs job/generate -f

  - name: Build (apply JTAF roles)
    jenkins_url: build_jtaf_fabric
    category: BUILD
    configuration:
      shell_command: >
        write_yaml_files.py;
        create_ansible_job_k8s.py build;
        kubectl apply -f build.yaml;
        kubectl wait --for=jsonpath="{.status.ready}"=1 job/build --timeout=600s;
        kubectl logs job/build -f

  - name: Dump Configuration
    jenkins_url: dump_jtaf_fabric
    category: BUILD
    configuration:
      shell_command: >
        write_yaml_files.py;
        create_ansible_job_k8s.py dump;
        kubectl apply -f dump.yaml;
        kubectl wait --for=jsonpath="{.status.ready}"=1 job/dump --timeout=600s;
        kubectl logs job/dump -f

  - name: Test
    jenkins_url: test_jtaf_fabric
    category: TEST
    configuration:
      shell_command: >
        write_yaml_files.py;
        python3 robot.py job-ansible job-robot;
        kubectl apply -f job-ansible.yaml;
        kubectl wait --for=jsonpath="{.status.ready}"=1 job/job-ansible --timeout=600s;
        kubectl logs job/job-ansible -f;
        kubectl apply -f job-robot.yaml;
        kubectl wait --for=jsonpath="{.status.ready}"=1 job/job-robot --timeout=600s;
        kubectl logs job/job-robot -f
      output_path: test/outputs