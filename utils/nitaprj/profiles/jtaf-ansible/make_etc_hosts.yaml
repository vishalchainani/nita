- name: Prepare device hostname resolution
  hosts: all
  connection: local
  gather_facts: no
  tasks:
    - name: Add device management address to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^\S+\s+{{ inventory_hostname | regex_escape }}\s*$'
        line: "{{ (ansible_host | default(management_interface.ip)) | split('/') | first }} {{ inventory_hostname }}"
        unsafe_writes: true
      throttle: 1
